<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="eduGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Outer Rounded Shield Container -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="url(#eduGrad)" filter="url(#shadow)" />

  <!-- Dynamic Curved Path Arrow (Career Path) -->
  <path d="M 28 84 Q 50 82, 60 58 T 88 28" fill="none" stroke="url(#tealGrad)" stroke-width="8" stroke-linecap="round" />

  <!-- Path Arrowhead -->
  <polygon points="86,22 96,30 84,38" fill="#10b981" />

  <!-- Diamond / Compass Star Emblem -->
  <path d="M 60 22 L 68 36 L 60 50 L 52 36 Z" fill="url(#goldGrad)" />

  <!-- Minimalist Graduation Cap Base -->
  <path d="M 26 48 L 60 34 L 94 48 L 60 62 Z" fill="#ffffff" />
  <path d="M 38 54 L 38 70 Q 60 82, 82 70 L 82 54" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Cap Tassel with Gold Accent -->
  <path d="M 82 48 L 88 64" fill="none" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round" />
  <circle cx="88" cy="67" r="3.5" fill="#f59e0b" />
</svg>
